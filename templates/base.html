<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ blog_title }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ blog_subtitle }}{% endblock %}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.svg') }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ blog_title }}">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='images/og-cover.png') }}">
    <meta property="og:url" content="{{ site_url }}{{ request.path }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="site-logo" href="{{ url_for('blog.index') }}">
            <img class="site-logo__img" src="{{ url_for('static', filename='images/logo.svg') }}" alt="{{ blog_title }}">
            <span class="site-logo__text">{{ blog_title }}</span>
        </a>
        <nav class="site-nav">
            <a href="{{ url_for('blog.index') }}">首页</a>
            <a href="{{ url_for('blog.tags') }}">标签</a>
            <a href="{{ url_for('blog.archives') }}">归档</a>
            <a href="{{ url_for('blog.about') }}">关于</a>
        </nav>
    </div>
</header>

<main class="container main-content">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; {{ current_year }} {{ blog_author }} · 由 Flask 强力驱动</p>
    </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
